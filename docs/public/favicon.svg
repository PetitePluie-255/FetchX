<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer ring arc (the "fetch" - request/response roundtrip) -->
  <path d="M140 340
           A 120 120 0 0 1 140 172
           A 120 120 0 0 1 340 120"
        fill="none" stroke="#93C5FD" stroke-width="24" stroke-linecap="round"/>
  <!-- Arrowhead on the outer arc -->
  <path d="M340 120 L310 162 L340 166 Z" fill="#93C5FD"/>
  <!-- X shape (the "X" in FetchX) - bold strokes -->
  <line x1="176" y1="176" x2="336" y2="336" stroke="#fff" stroke-width="40" stroke-linecap="round"/>
  <line x1="336" y1="176" x2="176" y2="336" stroke="#fff" stroke-width="40" stroke-linecap="round"/>
</svg>
