name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'fetchx-v*'
      - 'logger-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Run tests
        run: pnpm -r test

      - name: Run linting
        run: pnpm lint

      - name: Type check
        run: pnpm -r type-check

      # ── Determine which package to publish from tag prefix ──
      - name: Determine package
        if: startsWith(github.ref, 'refs/tags/')
        id: extract
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == fetchx-v* ]]; then
            echo "dir=packages/fetchx" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == logger-v* ]]; then
            echo "dir=packages/plugin-logger" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.extract.outputs.dir != ''
        run: cd "${{ steps.extract.outputs.dir }}" && pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
